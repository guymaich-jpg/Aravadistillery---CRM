# Firestore backup — dumps the shared production database (aravadistillery-crm)
# to a GitHub Actions artifact via the Admin SDK (read-only). Two triggers:
#
#   1. schedule        — daily at 02:00 UTC (05:00 Israel)
#   2. workflow_dispatch — on-demand / per-release, before each production release
#      Trigger from either app's release flow:
#        gh workflow run firestore-backup.yml -R guymaich-jpg/Aravadistillery---CRM \
#          -f app=crm -f version=6.3.0
#
# Uses scripts/backup/dump-firestore.mjs — a JSON dump via firebase-admin,
# NOT `gcloud firestore export`. This needs no GCS bucket and no Blaze billing
# plan, only a service account with `roles/datastore.viewer` on the project.
# See docs/backups.md for setup and restore. If Blaze billing is enabled
# later, switching to native `gcloud firestore export` (cheaper at scale,
# supports point-in-time `gcloud firestore import` restore) is a reasonable
# upgrade — this workflow is deliberately the billing-free baseline.
#
# Required repo secret: FIRESTORE_BACKUP_SA_KEY (service account JSON, read-only)

name: Firestore Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: 'App triggering the release export (crm / factory)'
        required: false
        default: 'manual'
        type: string
      version:
        description: 'Release version being backed up (e.g. 6.3.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: firestore-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts/backup
        run: npm install --no-save

      - name: Compute backup name
        id: name
        run: |
          STAMP="$(date -u +%Y-%m-%d-%H%M)"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            NAME="scheduled-${STAMP}"
          elif [ -n "${{ inputs.version }}" ]; then
            NAME="release-${{ inputs.app }}-v${{ inputs.version }}-${STAMP}"
          else
            NAME="manual-${STAMP}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Dump Firestore
        working-directory: scripts/backup
        env:
          FIRESTORE_BACKUP_SA_KEY: ${{ secrets.FIRESTORE_BACKUP_SA_KEY }}
        run: node dump-firestore.mjs "../../firestore-backup-out"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestore-backup-${{ steps.name.outputs.name }}
          path: firestore-backup-out/
          retention-days: 90
