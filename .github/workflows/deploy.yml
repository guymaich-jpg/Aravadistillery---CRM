name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Stage 1: Lint ────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # ── Stage 2: Test ────────────────────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  # ── Stage 2b: E2E smoke (browser) ────────────────────────────────────────
  e2e:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── Stage 3: Build & Deploy to GitHub Pages ────────────────────────────
  deploy:
    needs: [test, e2e]
    # Only main and staging deploy. claude/** branches still get full lint/
    # test/e2e signal from the push trigger above — they just don't reach
    # the live Pages site. Unreviewed branch code deploying straight to
    # production on every push was a real, previously-flagged risk here.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      # The Pages artifact always carries BOTH environments: production at /
      # and staging at /staging/. A push to the staging branch must therefore
      # rebuild the root from main — never deploy staging code to the root.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/staging' && 'main' || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_MANAGER_EMAILS: ${{ secrets.VITE_MANAGER_EMAILS }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_BACKUP_WEBHOOK_URL: ${{ secrets.VITE_BACKUP_WEBHOOK_URL }}
        run: npm run build

      # ── Staging build (dist/staging/) ────────────────────────────────────
      # Runs only when the staging branch and the VITE_STG_* secrets exist;
      # until then the workflow behaves exactly as before (prod-only artifact).
      - name: Check staging build preconditions
        id: stg
        env:
          HAS_STG_SECRETS: ${{ secrets.VITE_STG_FIREBASE_PROJECT_ID != '' }}
        run: |
          if [ "$HAS_STG_SECRETS" = "true" ] && git ls-remote --exit-code --heads origin staging >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Staging build skipped (needs a 'staging' branch and VITE_STG_* secrets)"
          fi

      # The staging steps run continue-on-error: a broken staging branch must
      # never block shipping the production artifact (e.g. a main hotfix).
      # If staging fails, the artifact simply ships without /staging/.
      - name: Checkout staging branch
        if: steps.stg.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging-src

      - name: Build staging
        if: steps.stg.outputs.enabled == 'true'
        continue-on-error: true
        working-directory: staging-src
        env:
          VITE_APP_ENV: staging
          VITE_BASE_PATH: /Aravadistillery---CRM/staging/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_STG_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_STG_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_STG_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_STG_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_STG_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_STG_FIREBASE_APP_ID }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_MANAGER_EMAILS: ${{ secrets.VITE_MANAGER_EMAILS }}
          # Deliberately NOT set for staging:
          #   VITE_BACKUP_WEBHOOK_URL  — staging must never write to the
          #                              production Google Sheets backup
          #   VITE_RECAPTCHA_SITE_KEY  — prod App Check key won't accept the
          #                              staging config; add a dedicated
          #                              VITE_STG_RECAPTCHA_SITE_KEY if needed
        run: |
          npm ci
          npm run build

      - name: Merge staging into Pages artifact
        if: steps.stg.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          mkdir -p dist/staging
          cp -R staging-src/dist/. dist/staging/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Stage 4: Live QA smoke against the freshly-deployed environment ───────
  # Runs the committed read-only smoke (qa/live-smoke.spec.ts) against the real
  # deployment: full authenticated pass on staging (Vercel), lightweight
  # unauthenticated pass on production. A red result here flags a broken deploy
  # without touching data. Staging creds come from repo secrets; if they are
  # absent the authenticated tests self-skip (unauth checks still run).
  qa-live:
    needs: deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Wait for the deployment to settle
        run: sleep 30

      - name: Live QA smoke
        env:
          # staging → canonical Vercel URL; main → production Pages URL
          QA_TARGET_URL: ${{ github.ref == 'refs/heads/staging' && 'https://aravadistillery-crm-staging.vercel.app' || 'https://guymaich-jpg.github.io/Aravadistillery---CRM/' }}
          # Authenticated pass on staging only; production runs unauthenticated
          # (no prod creds in CI — the auth tests self-skip).
          QA_EMAIL: ${{ github.ref == 'refs/heads/staging' && secrets.QA_STG_EMAIL || '' }}
          QA_PASSWORD: ${{ github.ref == 'refs/heads/staging' && secrets.QA_STG_PASSWORD || '' }}
        run: npm run qa:live

      - name: Upload QA report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-live-report
          path: playwright-report/
          retention-days: 14
