name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Stage 1: Lint ────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # ── Stage 2: Test ────────────────────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  # ── Stage 2b: E2E smoke (browser) ────────────────────────────────────────
  e2e:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── Stage 3: GitHub Pages → redirect to Vercel production ─────────────────
  # Production moved to Vercel (https://aravadistillery-crm.vercel.app). GitHub
  # Pages now serves only a redirect stub so old bookmarks and deep links keep
  # working; the app is no longer built for Pages (the /staging/ dual-build is
  # retired — staging lives on Vercel).
  deploy:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect stub
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="he">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>מערכת הלקוחות עברה כתובת</title>
          <link rel="canonical" href="https://aravadistillery-crm.vercel.app/">
          <meta name="robots" content="noindex">
          <script>
          (function () {
          var base = "https://aravadistillery-crm.vercel.app";
          var path = location.pathname.replace(/^\/Aravadistillery---CRM/, "");
          location.replace(base + path + location.search + location.hash);
          })();
          </script>
          <meta http-equiv="refresh" content="0; url=https://aravadistillery-crm.vercel.app/">
          <style>
          body { font-family: system-ui, sans-serif; direction: rtl; text-align: center; padding: 4rem 1rem; color: #252525; background: #f4efe4; }
          a { color: #b06a3a; }
          </style>
          </head>
          <body>
          <p>מערכת ניהול הלקוחות עברה לכתובת חדשה.</p>
          <p><a href="https://aravadistillery-crm.vercel.app/">להמשך לחצו כאן</a></p>
          </body>
          </html>
          HTML
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Stage 4: Live QA smoke against the freshly-deployed environment ───────
  # Runs the committed read-only smoke (qa/live-smoke.spec.ts) against the real
  # Vercel deployment: full authenticated pass on staging, lightweight
  # unauthenticated pass on production. A red result flags a broken deploy
  # without touching data. Staging creds come from repo secrets; if absent the
  # authenticated tests self-skip (unauth checks still run). Not gated on the
  # Pages `deploy` job — both environments are served by Vercel, which deploys
  # independently on push and is ready by the time lint/test/e2e finish.
  qa-live:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Wait for the deployment to settle
        run: sleep 30

      - name: Live QA smoke
        env:
          # both environments are on Vercel
          QA_TARGET_URL: ${{ github.ref == 'refs/heads/staging' && 'https://aravadistillery-crm-staging.vercel.app' || 'https://aravadistillery-crm.vercel.app' }}
          # Authenticated pass on staging only; production runs unauthenticated
          # (no prod creds in CI — the auth tests self-skip).
          QA_EMAIL: ${{ github.ref == 'refs/heads/staging' && secrets.QA_STG_EMAIL || '' }}
          QA_PASSWORD: ${{ github.ref == 'refs/heads/staging' && secrets.QA_STG_PASSWORD || '' }}
        run: npm run qa:live

      - name: Upload QA report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-live-report
          path: playwright-report/
          retention-days: 14
